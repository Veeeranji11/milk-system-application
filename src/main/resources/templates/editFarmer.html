<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Farmer - Village Milk Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">
                <i class="fa-solid fa-cow fs-4 text-warning"></i>
                <span data-i18n="systemTitle">Village Milk System</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fa-solid fa-chart-line me-1"></i> <span data-i18n="dashboard">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/farmers}">
                            <i class="fa-solid fa-users me-1"></i> <span data-i18n="farmers">Farmers</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/collections}">
                            <i class="fa-solid fa-bottle-droplet me-1"></i> <span data-i18n="collections">Collections</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/payments}">
                            <i class="fa-solid fa-indian-rupee-sign me-1"></i> <span data-i18n="payments">Payments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reports}">
                            <i class="fa-solid fa-file-lines me-1"></i> <span data-i18n="reports">Reports</span>
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <div class="btn-group btn-group-sm me-2">
                        <button type="button" class="btn btn-outline-light lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                        <button type="button" class="btn btn-outline-light lang-btn" data-lang="te" onclick="setLanguage('te')">తెలుగు</button>
                    </div>
                    <a th:href="@{/admin/farmers}" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> <span data-i18n="farmers">Farmer Directory</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-custom">
                    <div class="card-custom-header bg-secondary text-white">
                        <h5 class="text-white mb-0"><i class="fa-solid fa-user-pen me-2"></i>Edit Farmer Details (#<span th:text="${farmer.id}"></span>)</h5>
                    </div>
                    <div class="p-4">
                        <form th:action="@{'/admin/farmers/edit/' + ${farmer.id}}" method="post">
                            
                            <h6 class="text-secondary fw-bold mb-3 border-bottom pb-2">
                                <i class="fa-solid fa-id-card me-2"></i>Personal & Contact Details
                            </h6>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-semibold">Farmer Full Name <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                        <input type="text" id="name" name="name" class="form-control" th:value="${farmer.name}" required autofocus>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                        <input type="tel" id="phone" name="phone" class="form-control" th:value="${farmer.phone}" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="village" class="form-label fw-semibold">Village / Locality</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-location-dot text-muted"></i></span>
                                        <input type="text" id="village" name="village" class="form-control" th:value="${farmer.village}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="buffaloCount" class="form-label fw-semibold">Number of Cattle / Buffalos <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-cow text-muted"></i></span>
                                        <input type="number" id="buffaloCount" name="buffaloCount" class="form-control" th:value="${farmer.buffaloCount}" min="0" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="address" class="form-label fw-semibold">Full Address / Landmark</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-house text-muted"></i></span>
                                    <input type="text" id="address" name="address" class="form-control" th:value="${farmer.address}">
                                </div>
                            </div>

                            <h6 class="text-secondary fw-bold mb-3 border-bottom pb-2">
                                <i class="fa-solid fa-building-columns me-2"></i>Bank & Digital Payment Details
                            </h6>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="bankAccountNo" class="form-label fw-semibold">Bank Account Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-credit-card text-muted"></i></span>
                                        <input type="text" id="bankAccountNo" name="bankAccountNo" class="form-control" th:value="${farmer.bankAccountNo}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="ifscCode" class="form-label fw-semibold">IFSC Code</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="fa-solid fa-code-branch text-muted"></i></span>
                                        <input type="text" id="ifscCode" name="ifscCode" class="form-control text-uppercase" th:value="${farmer.ifscCode}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="upiId" class="form-label fw-semibold">UPI ID (PhonePe / Google Pay / Paytm)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-mobile-screen-button text-muted"></i></span>
                                    <input type="text" id="upiId" name="upiId" class="form-control" th:value="${farmer.upiId}">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill py-2 fw-semibold">
                                    <i class="fa-solid fa-check me-1"></i> Update Changes
                                </button>
                                <a th:href="@{/admin/farmers}" class="btn btn-outline-secondary py-2">
                                    Cancel
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/app.js}"></script>
</body>
</html>
