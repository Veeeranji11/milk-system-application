# ==============================================================================
# Cloud-Based Multi-Tenant SaaS Milk Management System Configuration
# ==============================================================================

server.port=${PORT:8080}
server.forward-headers-strategy=native

# Managed Database Configuration (supports MySQL locally, PostgreSQL on Render)
# Driver & dialect are auto-detected by Spring Boot from the JDBC URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3303/milk_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP Connection Pool (reduced for free tier)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=MilkSaaSHikariCP

# JPA & Hibernate Settings (dialect auto-detected)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:SuperSecretSecureKeyForMilkSaaSSystemAuthenticationApplication2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://app.milkmanagementsystem.com}

# Cloud Document Storage Configuration
app.storage.base-dir=${STORAGE_BASE_DIR:./cloud-storage}
app.storage.public-base-url=/api/storage

# SaaS Payment Gateway Configuration (MOCK, RAZORPAY, STRIPE)
app.payment.provider=${PAYMENT_PROVIDER:MOCK}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_sample_key_12345}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:sample_secret_key_67890}

# Spring Boot Actuator Monitoring, Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging & Operations
logging.level.root=INFO
logging.level.com.example.MilkSystemApplication=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [tenant:%X{tenantId:-system}] - %msg%n

# Thymeleaf Cache (disabled for development)
spring.thymeleaf.cache=false