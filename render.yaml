# render.yaml — Render.com Blueprint for MilkSync Cloud SaaS
# Deploys: Web Service (Docker) + PostgreSQL Database (Free Tier)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: milk-system-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: milk-system-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: milk-system-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: milk-system-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://milk-system-app.onrender.com
      - key: STORAGE_BASE_DIR
        value: /tmp/cloud-storage
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: PORT
        value: "8080"

databases:
  - name: milk-system-db
    databaseName: milk_system
    plan: free
    region: singapore
