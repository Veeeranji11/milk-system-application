<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Village Milk System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <!-- Farmer Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-farmer py-3">
        <div class="container">
            <a class="navbar-brand" th:href="@{/farmer/dashboard}">
                <i class="fa-solid fa-cow fs-4 text-warning"></i>
                <span data-i18n="systemTitle">Village Milk System</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/farmer/dashboard}" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> <span data-i18n="dashboard">Dashboard</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Flash Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card-custom">
                    <div class="card-custom-header bg-success text-white">
                        <h5 class="text-white mb-0">
                            <i class="fa-solid fa-key me-2"></i><span data-i18n="changePassword">Change Login Password</span>
                        </h5>
                    </div>
                    <div class="p-4">
                        <div class="mb-3 text-muted small">
                            Farmer: <strong class="text-dark" th:text="${farmer.name}"></strong> (ID: #<span th:text="${farmer.id}"></span>)
                        </div>

                        <form th:action="@{/farmer/change-password}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Current Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="currentPassword" class="form-control" placeholder="Enter current password" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">New Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                                    <input type="password" name="newPassword" class="form-control" placeholder="Enter new password (min 4 chars)" required minlength="4">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Confirm New Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-check-double text-muted"></i></span>
                                    <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter new password" required minlength="4">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success flex-fill py-2 fw-bold shadow-sm">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Update Password
                                </button>
                                <a th:href="@{/farmer/dashboard}" class="btn btn-outline-secondary py-2">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/app.js}"></script>
</body>
</html>
