<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Milk Collection - Village Milk Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">
                <i class="fa-solid fa-cow fs-4 text-warning"></i>
                <span data-i18n="systemTitle">Village Milk System</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fa-solid fa-chart-line me-1"></i> <span data-i18n="dashboard">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/farmers}">
                            <i class="fa-solid fa-users me-1"></i> <span data-i18n="farmers">Farmers</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/collections}">
                            <i class="fa-solid fa-bottle-droplet me-1"></i> <span data-i18n="collections">Collections</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/payments}">
                            <i class="fa-solid fa-indian-rupee-sign me-1"></i> <span data-i18n="payments">Payments</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reports}">
                            <i class="fa-solid fa-file-lines me-1"></i> <span data-i18n="reports">Reports</span>
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <div class="btn-group btn-group-sm me-2">
                        <button type="button" class="btn btn-outline-light lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                        <button type="button" class="btn btn-outline-light lang-btn" data-lang="te" onclick="setLanguage('te')">తెలుగు</button>
                    </div>
                    <a th:href="@{/admin/collections}" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-list me-1"></i> <span data-i18n="collections">All Collections</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card-custom">
                    <div class="card-custom-header bg-warning text-dark">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-bottle-droplet me-2"></i><span data-i18n="recordMilk">Record Milk Collection</span></h5>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/admin/collections/add}" method="post">
                            <input type="hidden" id="globalRateFactor" th:value="${rateFactor}">
                            
                            <!-- Farmer dropdown -->
                            <div class="mb-3">
                                <label for="farmerId" class="form-label fw-semibold"><span data-i18n="farmer">Select Farmer</span> <span class="text-danger">*</span></label>
                                <select id="farmerId" name="farmerId" class="form-select" required autofocus>
                                    <option value="" disabled selected>-- Choose Registered Farmer --</option>
                                    <option th:each="farmer : ${farmers}"
                                            th:value="${farmer.id}"
                                            th:text="${farmer.name + ' (' + (farmer.village != null ? farmer.village : 'ID: ' + farmer.id) + ')'}"></option>
                                </select>
                            </div>

                            <!-- Date and Shift -->
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label for="date" class="form-label fw-semibold"><span data-i18n="date">Collection Date</span> <span class="text-danger">*</span></label>
                                    <input type="date" id="date" name="date" class="form-control" th:value="${#temporals.format(today, 'yyyy-MM-dd')}" required>
                                </div>
                                <div class="col-6">
                                    <label for="shift" class="form-label fw-semibold"><span data-i18n="shift">Shift</span> <span class="text-danger">*</span></label>
                                    <select id="shift" name="shift" class="form-select" required>
                                        <option value="Morning">🌅 Morning / ఉదయం</option>
                                        <option value="Evening">🌇 Evening / సాయంత్రం</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Quality & Collection Time -->
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label for="quality" class="form-label fw-semibold">Milk Quality Grade <span class="text-danger">*</span></label>
                                    <select id="quality" name="quality" class="form-select">
                                        <option value="Good" selected>Good (Standard Dairy Quality)</option>
                                        <option value="Excellent (Grade A)">Excellent (Grade A / High Fat)</option>
                                        <option value="Standard">Standard</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="collectionTime" class="form-label fw-semibold">Time of Collection <span class="text-danger">*</span></label>
                                    <input type="time" id="collectionTime" name="collectionTime" class="form-control" th:value="${#temporals.format(currentTime, 'HH:mm')}" required>
                                </div>
                            </div>

                            <!-- Litres -->
                            <div class="mb-3">
                                <label for="litres" class="form-label fw-semibold"><span data-i18n="quantity">Milk Quantity in Litres</span> (L) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" step="0.1" min="0.1" id="litres" name="litres" class="form-control" placeholder="e.g. 12.5" required oninput="calculateAmount()">
                                    <span class="input-group-text">Litres</span>
                                </div>
                            </div>

                            <!-- Fat Percentage -->
                            <div class="mb-3">
                                <label for="fatPercentage" class="form-label fw-semibold"><span data-i18n="fatPercentage">Fat Percentage</span> (%) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" step="0.1" min="1.0" max="15.0" id="fatPercentage" name="fatPercentage" class="form-control" placeholder="e.g. 6.5" required oninput="onFatChange()">
                                    <span class="input-group-text">% Fat</span>
                                </div>
                            </div>

                            <!-- Rate Per Litre (Editable) -->
                            <div class="mb-4">
                                <label for="ratePerLitre" class="form-label fw-semibold">
                                    <span data-i18n="ratePerLitre">Rate per Litre</span> (₹/L) <small class="text-muted fw-normal">(Auto-calculated: Fat% × ₹<span th:text="${rateFactor}"></span>)</small>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" step="0.01" min="1.0" id="ratePerLitre" name="ratePerLitre" class="form-control fw-bold" placeholder="e.g. 48.75" oninput="calculateAmount()">
                                    <span class="input-group-text">/ Litre</span>
                                </div>
                            </div>

                            <!-- Live Calculation Box -->
                            <div class="p-3 mb-4 bg-light rounded border">
                                <div class="d-flex justify-content-between text-muted small mb-1">
                                    <span data-i18n="ratePerLitre">Rate per Litre:</span>
                                    <strong class="text-dark">₹<span id="calculatedRate">0.00</span> / L</strong>
                                </div>
                                <div class="d-flex justify-content-between fs-4 fw-bold text-success">
                                    <span data-i18n="totalAmount">Total Payment:</span>
                                    <span>₹<span id="calculatedAmount">0.00</span></span>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-warning flex-fill py-2 fw-bold text-dark shadow-sm">
                                    <i class="fa-solid fa-check me-1"></i> Save Collection Entry
                                </button>
                                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary py-2">
                                    Cancel
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/app.js}"></script>
    <script>
        function onFatChange() {
            const fat = parseFloat(document.getElementById('fatPercentage').value) || 0;
            const factor = parseFloat(document.getElementById('globalRateFactor').value) || 7.5;
            if (fat > 0) {
                const autoRate = Math.round(fat * factor * 100) / 100;
                document.getElementById('ratePerLitre').value = autoRate.toFixed(2);
            }
            calculateAmount();
        }

        function calculateAmount() {
            const litres = parseFloat(document.getElementById('litres').value) || 0;
            let rate = parseFloat(document.getElementById('ratePerLitre').value);
            const fat = parseFloat(document.getElementById('fatPercentage').value) || 0;
            const factor = parseFloat(document.getElementById('globalRateFactor').value) || 7.5;

            if (isNaN(rate) || rate <= 0) {
                rate = Math.round(fat * factor * 100) / 100;
            }

            const amount = Math.round(litres * rate * 100) / 100;

            document.getElementById('calculatedRate').innerText = (rate || 0).toFixed(2);
            document.getElementById('calculatedAmount').innerText = amount.toFixed(2);
        }
    </script>
</body>
</html>
